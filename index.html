                    options: [
                        "Par une limitation de sa puissance face à la créature",
                        "Par une volonté délibérée d'éprouver la souffrance humaine",
                        "Par le respect de la liberté dont il sait tirer un bien",
                        "Par un détachement progressif du gouvernement du monde"
                    ],
                    correctIndex: 2,
                    explication: "Dieu ne laisserait jamais le mal exister s'il n'était assez puissant et bon pour faire sortir le bien du mal lui-même, tout en respectant la liberté humaine (CEC 311)[span_37](start_span)[span_37](end_span)."
                },
                {
                    question: "Que désignent les 'preuves de l'existence de Dieu' selon le Catéchisme ?",
                    options: [
                        "Des démonstrations tirées des sciences expérimentales",
                        "Des arguments convergents fondés sur la raison humaine",
                        "Des certitudes d'ordre purement émotionnel et privé",
                        "Des apparitions publiques scientifiquement attestées"
                    ],
                    correctIndex: 1,
                    explication: "Ces 'preuves' ne sont pas au sens des sciences naturelles, mais des arguments convergents (ordre du monde, conscience) qui permettent d'atteindre la certitude (CEC 31)[span_38](start_span)[span_38](end_span)."
                },
                {
                    question: "Quel élément historique s'oppose à l'idée d'une Résurrection inventée par les disciples ?",
                    options: [
                        "L'attente enthousiaste du miracle par les Apôtres",
                        "L'incrédulité et le désarroi initiaux des témoins",
                        "La confirmation du miracle par le Sénat romain",
                        "L'absence totale de doutes chez les Évangélistes"
                    ],
                    correctIndex: 1,
                    explication: "Loin d'une exaltation mystique, les disciples étaient effrayés, ne croyaient pas les saintes femmes au début et Jésus a dû reprocher leur incrédulité (CEC 643)[span_39](start_span)[span_39](end_span)."
                },
                {
                    question: "À qui l'Église attribue-t-elle la responsabilité première de la passion du Christ ?",
                    options: [
                        "Aux seuls dirigeants religieux de Jérusalem",
                        "Au seul représentant de l'autorité romaine Pilate",
                        "À l'ensemble des pécheurs de tous les temps",
                        "Au seul apôtre Judas par sa trahison"
                    ],
                    correctIndex: 2,
                    explication: "L'Église n'a jamais oublié que les pécheurs eux-mêmes furent les auteurs de la passion ; imputer la mort du Christ à tous les Juifs est condamné par Vatican II (CEC 598 ; NA 4)[span_40](start_span)[span_40](end_span)."
                },
                {
                    question: "Quels indices manifestent en l'homme l'existence d'une âme spirituelle ?",
                    options: [
                        "Les seules fonctions biologiques du corps",
                        "La quête de vérité, la conscience et la liberté",
                        "La seule complexité des connexions cérébrales",
                        "L'instinct de conservation propre aux vivants"
                    ],
                    correctIndex: 1,
                    explication: "Avec son sens du bien moral, sa liberté et la voix de sa conscience, l'homme perçoit des signes de son âme spirituelle, irréductible à la seule matière (CEC 33)[span_41](start_span)[span_41](end_span)."
                },
                {
                    question: "Comment la foi explique-t-elle l'existence du mal physique dans la nature ?",
                    options: ["Par un défaut initial dans le plan de la création", "Par la domination exclusive du principe du mal", "Par un monde créé 'en état de voie' vers sa perfection", "Par une illusion liée à la finitude humaine"],
                    correctIndex: 2,
                    explication: "Dieu a freely créé un monde en devenir ('en état de voie'). Ce devenir comporte l'apparition de certains êtres et la disparition d'autres, d'où le mal physique (CEC 310)[span_42](start_span)[span_42](end_span)."
                },
                {
                    question: "Pourquoi la liturgie chante-t-elle l''heureuse faute' d'Adam (Exsultet) ?",
                    options: [
                        "Parce que la grâce du Christ surpasse le bien perdu",
                        "Parce que le péché était nécessaire à la création",
                        "Parce que la loi ancienne était insuffisante",
                        "Parce que le mal est indifférent aux yeux de Dieu"
                    ],
                    correctIndex: 0,
                    explication: "Rien ne s'oppose à ce que la nature humaine ait été destinée à une fin plus haute après le péché ; la faute a mérité un tel et un si grand Rédempteur (CEC 412)[span_43](start_span)[span_43](end_span)."
                },
                {
                    question: "Quel est le rôle des miracles accomplis par Jésus dans la démarche de foi ?",
                    options: [
                        "Remplacer l'effort personnel de conversion",
                        "Offrir des motifs de crédibilité montrant que la foi est raisonnable",
                        "Contraindre les esprits crédules par le merveilleux",
                        "Servir d'illustrations purement symboliques"
                    ],
                    correctIndex: 1,
                    explication: "Les miracles du Christ sont des signes certains de la Révélation, des 'motifs de crédibilité' montrant que la foi n'est nullement un mouvement aveugle de l'esprit (CEC 156)[span_44](start_span)[span_44](end_span)."
                },
                {
                    question: "Que professe la foi chrétienne concernant la création du monde (ex nihilo) ?",
                    options: [
                        "Que le monde est une émanation nécessaire de Dieu",
                        "Que le Bien et le Mal sont deux principes éternels",
                        "Que Dieu a créé l'univers librement à partir de rien",
                        "Que la matière préexistait au travail du Créateur"
                    ],
                    correctIndex: 2,
                    explication: "La foi affirme que Dieu n'a pas besoin de matière préexistante ni n'émane de lui-même le monde, mais qu'il crée librement 'de rien' (CEC 296)[span_45](start_span)[span_45](end_span)."
                },
                {
                    question: "Quelle est la portée apologétique de la constatation du 'tombeau vide' ?",
                    options: [
                        "Une preuve scientifique directe de la résurrection",
                        "Un signe essentiel ouvrant les disciples à la foi",
                        "Une légende élaborée au cours des siècles",
                        "Une preuve de l'enlèvement du corps par des proches"
                    ],
                    correctIndex: 1,
                    explication: "Le sépulcre vide n'est pas en soi une preuve directe, mais il a constitué un signe essentiel et le premier pas vers la foi en la Résurrection pour les apôtres (CEC 640)[span_46](start_span)[span_46](end_span)."
                },
                {
                    question: "Que condamne l'Église lorsqu'elle rejette le 'millénarisme' ?",
                    options: [
                        "L'organisation du calendrier liturgique annuel",
                        "La prétention de réaliser le Royaume ultime dans l'histoire",
                        "L'étude des prophéties sur la fin des temps",
                        "La célébration des jubilés tous les mille ans"
                    ],
                    correctIndex: 1,
                    explication: "L'imposture antichristique est un messianisme sécularisé prétendant réaliser sur terre l'espérance qui ne peut s'achever qu'au-delà, par le Jugement divin (CEC 676)[span_47](start_span)[span_47](end_span)."
                }
            ]
        };

        const themes = [
            { id: 'doctrine', label: 'Doctrine & Église', color: 'bg-blue-500' },
            { id: 'ecritures', label: 'Les Écritures', color: 'bg-green-600' },
            { id: 'pratique', label: 'La Vie Pratique', color: 'bg-purple-500' },
            { id: 'apologetique', label: 'Apologétique', color: 'bg-red-500' },
            { id: 'mix', label: 'Mix (Aléatoire)', color: 'bg-gray-800' }
        ];

        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const SunIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        );

        const MoonIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        );

        // 2. COMPOSANT PRINCIPAL (APPLICATION)
        function App() {
            const [gameState, setGameState] = React.useState('home'); 
            const [questions, setQuestions] = React.useState([]);
            const [currentQIndex, setCurrentQIndex] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [selectedAnswer, setSelectedAnswer] = React.useState(null);
            const [isDarkMode, setIsDarkMode] = React.useState(false);

            const toggleTheme = () => {
                setIsDarkMode(!isDarkMode);
                if (!isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            };

            const startQuiz = (themeId) => {
                let selectedQuestions = [];
                if (themeId === 'mix') {
                    const allQuestions = [
                        ...quizData.doctrine,
                        ...quizData.ecritures,
                        ...quizData.pratique,
                        ...quizData.apologetique
                    ];
                    selectedQuestions = shuffleArray(allQuestions).slice(0, 12); 
                } else {
                    selectedQuestions = shuffleArray(quizData[themeId]).slice(0, 12);
                }
                
                setQuestions(selectedQuestions);
                setCurrentQIndex(0);
                setScore(0);
                setSelectedAnswer(null);
                setGameState('quiz');
            };

            const handleAnswer = (index) => {
                if (selectedAnswer !== null) return; 
                setSelectedAnswer(index);
                if (index === questions[currentQIndex].correctIndex) {
                    setScore(score + 1);
                }
            };

            const nextQuestion = () => {
                if (currentQIndex + 1 < questions.length) {
                    setCurrentQIndex(currentQIndex + 1);
                    setSelectedAnswer(null);
                } else {
                    setGameState('score');
                }
            };

            return (
                <div className="min-h-[100dvh] bg-gray-100 dark:bg-gray-900 transition-colors duration-300 font-sans text-gray-900 dark:text-gray-100 relative pb-4">
                    
                    <button 
                        onClick={toggleTheme} 
                        className="absolute top-4 right-4 p-2 rounded-full bg-white dark:bg-gray-800 shadow-md text-gray-600 dark:text-gray-300 hover:scale-105 active:scale-95 transition-all z-20"
                        aria-label="Basculer le thème"
                    >
                        {isDarkMode ? <SunIcon /> : <MoonIcon />}
                    </button>

                    {/* ÉCRAN D'ACCUEIL */}
                    {gameState === 'home' && (
                        <div className="min-h-[100dvh] flex flex-col items-center justify-center p-4">
                            <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-md text-center transition-colors duration-300">
                                <div className="flex flex-col items-center justify-center space-y-4 mb-6">
                                    <div className="bg-white p-2 rounded-xl">
                                        <img src="logo-upsc.png" alt="Logo Unité Pastorale Sainte-Croix" className="h-16 object-contain" />
                                    </div>
                                    <img src="logo-pole-formation.jpeg" alt="Logo Pôle Formation" className="h-28 object-contain rounded-full shadow-sm border-2 border-white" />
                                </div>
                                <h1 className="text-3xl font-bold text-gray-800 dark:text-white mb-2">Quiz Catholique</h1>
                                <p className="text-gray-500 dark:text-gray-300 mb-8">Testez vos connaissances sur la foi, la doctrine et les écritures.</p>
                                <button 
                                    onClick={() => setGameState('theme')}
                                    className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg hover:bg-blue-700 active:scale-95 transition-all"
                                >
                                    Commencer
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ÉCRAN DES THÈMES */}
                    {gameState === 'theme' && (
                        <div className="min-h-[100dvh] flex flex-col items-center justify-center p-4">
                            <div className="w-full max-w-md">
                                <h2 className="text-2xl font-bold text-gray-800 dark:text-white mb-6 text-center">Choisissez un thème</h2>
                                <div className="grid gap-4">
                                    {themes.map((theme) => (
                                        <button
                                            key={theme.id}
                                            onClick={() => startQuiz(theme.id)}
                                            className={`${theme.color} text-white font-bold py-5 rounded-xl text-lg shadow-md hover:brightness-110 active:scale-95 transition-all`}
                                        >
                                            {theme.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ÉCRAN DE JEU (QUIZ) */}
                    {gameState === 'quiz' && (
                        <div className="min-h-[100dvh] flex flex-col p-4 w-full max-w-md mx-auto relative pt-12">
                            <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 mb-4 mt-2">
                                <div className="bg-blue-600 h-2 rounded-full transition-all duration-300" style={{ width: `${((currentQIndex + 1) / questions.length) * 100}%` }}></div>
                            </div>
                            
                            <div className="flex-grow pb-24">
                                <span className="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Question {currentQIndex + 1} / {questions.length}</span>
                                <h2 className="text-xl font-bold text-gray-800 dark:text-white mt-1 mb-5 leading-tight">{questions[currentQIndex].question}</h2>

                                <div className="grid gap-2.5">
                                    {questions[currentQIndex].options.map((option, index) => {
                                        let buttonClass = "bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 border-2 border-gray-200 dark:border-gray-600";
                                        
                                        if (selectedAnswer !== null) {
                                            if (index === questions[currentQIndex].correctIndex) {
                                                buttonClass = "bg-green-500 dark:bg-green-600 text-white border-green-500 dark:border-green-600";
                                            } else if (index === selectedAnswer) {
                                                buttonClass = "bg-red-500 dark:bg-red-600 text-white border-red-500 dark:border-red-600";
                                            } else {
                                                buttonClass = "bg-gray-100 dark:bg-gray-800/50 text-gray-400 dark:text-gray-500 border-gray-100 dark:border-gray-700 opacity-50";
                                            }
                                        } else {
                                            buttonClass += " hover:border-blue-400 dark:hover:border-blue-500 active:bg-gray-50 dark:active:bg-gray-700";
                                        }

                                        return (
                                            <button
                                                key={index}
                                                disabled={selectedAnswer !== null}
                                                onClick={() => handleAnswer(index)}
                                                className={`p-3 rounded-xl text-left font-semibold text-[15px] transition-colors ${buttonClass}`}
                                            >
                                                {option}
                                            </button>
                                        );
                                    })}
                                </div>

                                {selectedAnswer !== null && (
                                    <div className="mt-4 p-3.5 bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-xl slide-up">
                                        <p className="text-blue-900 dark:text-blue-200 text-sm leading-snug"><strong>Explication :</strong> {questions[currentQIndex].explication}</p>
                                    </div>
                                )}
                            </div>

                            {selectedAnswer !== null && (
                                <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/95 dark:bg-gray-900/95 backdrop-blur shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] dark:shadow-none dark:border-t dark:border-gray-800 z-10 flex justify-center">
                                    <div className="w-full max-w-md">
                                        <button
                                            onClick={nextQuestion}
                                            className="w-full bg-gray-900 dark:bg-blue-600 text-white font-bold py-3.5 rounded-xl text-lg shadow-md hover:bg-gray-800 dark:hover:bg-blue-700 active:scale-95 transition-all"
                                        >
                                            {currentQIndex + 1 === questions.length ? "Voir mon score" : "Question suivante"}
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ÉCRAN DE SCORE */}
                    {gameState === 'score' && (
                        <div className="min-h-[100dvh] flex flex-col items-center justify-center p-4">
                            <div className="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md text-center transition-colors duration-300">
                                <h2 className="text-3xl font-bold text-gray-800 dark:text-white mb-2">Bilan</h2>
                                <p className="text-gray-500 dark:text-gray-300 mb-6">
                                    {Math.round((score / questions.length) * 100) === 100 ? "Parfait ! Un sans faute." : Math.round((score / questions.length) * 100) < 50 ? "Encore quelques efforts !" : "Bien joué !"}
                                </p>
                                
                                <div className="text-6xl font-black text-blue-600 dark:text-blue-400 mb-8">
                                    {score} <span className="text-2xl text-gray-400 dark:text-gray-500">/ {questions.length}</span>
                                </div>

                                <button
                                    onClick={() => setGameState('home')}
                                    className="w-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-bold py-4 rounded-xl text-lg mb-3 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors"
                                >
                                    Retour à l'accueil
                                </button>
                                <button
                                    onClick={() => setGameState('theme')}
                                    className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg hover:bg-blue-700 transition-colors"
                                >
                                    Rejouer
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
