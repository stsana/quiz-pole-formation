<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Sainte-Croix</title>
    <!-- Chargement de React et ReactDOM via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Chargement de Babel pour compiler le JSX dans le navigateur -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chargement de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. BASE DE DONNÉES DES QUESTIONS
        const quizData = {
            doctrine: [
                {
                    question: "Combien y a-t-il de sacrements dans l'Église catholique ?",
                    options: ["5", "7", "10", "12"],
                    correctIndex: 1,
                    explication: "Les 7 sacrements sont le Baptême, l'Eucharistie, la Confirmation, la Pénitence, l'Onction des malades, l'Ordre et le Mariage."
                },
                {
                    question: "Que célèbre-t-on à la Pentecôte ?",
                    options: ["La naissance de Jésus", "La résurrection", "La descente du Saint-Esprit", "L'ascension"],
                    correctIndex: 2,
                    explication: "La Pentecôte marque la venue de l'Esprit Saint sur les apôtres, 50 jours après Pâques."
                }
            ],
            ecritures: [
                {
                    question: "Quel est le premier livre de la Bible ?",
                    options: ["L'Exode", "La Genèse", "Le Lévitique", "Les Psaumes"],
                    correctIndex: 1,
                    explication: "La Genèse raconte la création du monde et les origines de l'humanité."
                },
                {
                    question: "Qui a écrit la majorité des Épîtres du Nouveau Testament ?",
                    options: ["Saint Pierre", "Saint Jean", "Saint Paul", "Saint Luc"],
                    correctIndex: 2,
                    explication: "Saint Paul (Paul de Tarse) est l'auteur de 13 des 21 épîtres du Nouveau Testament."
                }
            ],
            pratique: [
                {
                    question: "Quel est le temps de préparation avant Pâques ?",
                    options: ["L'Avent", "Le Carême", "Le Temps Ordinaire", "L'Épiphanie"],
                    correctIndex: 1,
                    explication: "Le Carême est une période de 40 jours de jeûne, de prière et de partage avant Pâques."
                },
                {
                    question: "Quelle prière commence par 'Je vous salue...' ?",
                    options: ["Le Notre Père", "Le Credo", "Le Magnificat", "Le Je vous salue Marie (Ave Maria)"],
                    correctIndex: 3,
                    explication: "C'est la prière adressée à la Vierge Marie, reprenant les paroles de l'ange Gabriel."
                }
            ],
            apologetique: [
                {
                    question: "L'Église s'oppose-t-elle à la théorie de l'évolution (Big Bang) ?",
                    options: ["Oui, totalement", "Non, si Dieu en est l'origine", "Elle n'a pas d'avis", "Seulement pour les animaux"],
                    correctIndex: 1,
                    explication: "L'Église catholique accepte la théorie de l'évolution et le Big Bang, y voyant le moyen par lequel Dieu a créé l'univers."
                },
                {
                    question: "Qu'est-ce que l'Eucharistie pour les catholiques ?",
                    options: ["Un simple symbole", "Un souvenir historique", "La présence réelle du Christ", "Une tradition païenne"],
                    correctIndex: 2,
                    explication: "L'Église enseigne la transsubstantiation : le pain et le vin deviennent réellement le corps et le sang du Christ."
                }
            ]
        };

        const themes = [
            { id: 'doctrine', label: 'Doctrine & Église', color: 'bg-blue-500' },
            { id: 'ecritures', label: 'Les Écritures', color: 'bg-green-600' },
            { id: 'pratique', label: 'La Vie Pratique', color: 'bg-purple-500' },
            { id: 'apologetique', label: 'Apologétique', color: 'bg-red-500' },
            { id: 'mix', label: 'Mix (Aléatoire)', color: 'bg-gray-800' }
        ];

        // 2. COMPOSANT PRINCIPAL (APPLICATION)
        // Fonction pour mélanger un tableau aléatoirement (Fisher-Yates)
            const shuffleArray = (array) => {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            };
        function App() {
            const [gameState, setGameState] = React.useState('home'); // home, theme, quiz, score
            const [questions, setQuestions] = React.useState([]);
            const [currentQIndex, setCurrentQIndex] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [selectedAnswer, setSelectedAnswer] = React.useState(null);

           const startQuiz = (themeId) => {
    let selectedQuestions = [];
    
    if (themeId === 'mix') {
        // Regroupe toutes les questions et les mélange
        const allQuestions = [
            ...quizData.doctrine,
            ...quizData.ecritures,
            ...quizData.pratique,
            ...quizData.apologetique
        ];
        selectedQuestions = shuffleArray(allQuestions).slice(0, 5); // Garde 5 questions au hasard
    } else {
        // Mélange uniquement les questions du thème choisi
        selectedQuestions = shuffleArray(quizData[themeId]);
    }
    
    setQuestions(selectedQuestions);
    setCurrentQIndex(0);
    setScore(0);
    setSelectedAnswer(null);
    setGameState('quiz');
};

            const handleAnswer = (index) => {
                if (selectedAnswer !== null) return; 
                setSelectedAnswer(index);
                if (index === questions[currentQIndex].correctIndex) {
                    setScore(score + 1);
                }
            };

            const nextQuestion = () => {
                if (currentQIndex + 1 < questions.length) {
                    setCurrentQIndex(currentQIndex + 1);
                    setSelectedAnswer(null);
                } else {
                    setGameState('score');
                }
            };

            // Écran d'accueil
            if (gameState === 'home') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center">
                            <div className="flex flex-col items-center justify-center space-y-4 mb-6">
                                <img src="logo-upsc.png" alt="Logo Unité Pastorale Sainte-Croix" className="h-20 object-contain" />
                                <img src="logo-pole-formation.jpeg" alt="Logo Pôle Formation" className="h-32 object-contain rounded-full shadow-sm" />
                            </div>
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">Quiz Catholique</h1>
                            <p className="text-gray-500 mb-8">Testez vos connaissances sur la foi, la doctrine et les écritures.</p>
                            <button 
                                onClick={() => setGameState('theme')}
                                className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg active:scale-95 transition-transform"
                            >
                                Commencer
                            </button>
                        </div>
                    </div>
                );
            }

            // Écran Sélection du thème
            if (gameState === 'theme') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="w-full max-w-md">
                            <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">Choisissez un thème</h2>
                            <div className="grid gap-4">
                                {themes.map((theme) => (
                                    <button
                                        key={theme.id}
                                        onClick={() => startQuiz(theme.id)}
                                        className={`${theme.color} text-white font-bold py-5 rounded-xl text-lg shadow-md active:scale-95 transition-transform`}
                                    >
                                        {theme.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            // Écran de Quiz
            if (gameState === 'quiz') {
                const currentQuestion = questions[currentQIndex];
                const isAnswered = selectedAnswer !== null;

                return (
                    <div className="min-h-screen flex flex-col p-4 w-full max-w-md mx-auto">
                        <div className="w-full bg-gray-200 rounded-full h-2.5 mb-6 mt-4">
                            <div className="bg-blue-600 h-2.5 rounded-full" style={{ width: `${((currentQIndex + 1) / questions.length) * 100}%` }}></div>
                        </div>
                        
                        <div className="flex-grow">
                            <span className="text-sm font-semibold text-gray-500 uppercase">Question {currentQIndex + 1} / {questions.length}</span>
                            <h2 className="text-2xl font-bold text-gray-900 mt-2 mb-8">{currentQuestion.question}</h2>

                            <div className="grid gap-3">
                                {currentQuestion.options.map((option, index) => {
                                    let buttonClass = "bg-white text-gray-800 border-2 border-gray-200 hover:border-blue-500";
                                    
                                    if (isAnswered) {
                                        if (index === currentQuestion.correctIndex) {
                                            buttonClass = "bg-green-500 text-white border-green-500";
                                        } else if (index === selectedAnswer) {
                                            buttonClass = "bg-red-500 text-white border-red-500";
                                        } else {
                                            buttonClass = "bg-gray-100 text-gray-400 border-gray-100 opacity-50";
                                        }
                                    }

                                    return (
                                        <button
                                            key={index}
                                            disabled={isAnswered}
                                            onClick={() => handleAnswer(index)}
                                            className={`p-4 rounded-xl text-left font-semibold text-lg transition-colors ${buttonClass}`}
                                        >
                                            {option}
                                        </button>
                                    );
                                })}
                            </div>

                            {isAnswered && (
                                <div className="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-xl slide-up">
                                    <p className="text-blue-900 text-sm"><strong>Explication :</strong> {currentQuestion.explication}</p>
                                </div>
                            )}
                        </div>

                        {isAnswered && (
                            <button
                                onClick={nextQuestion}
                                className="w-full bg-gray-900 text-white font-bold py-4 rounded-xl text-lg mt-6 shadow-lg active:scale-95"
                            >
                                {currentQIndex + 1 === questions.length ? "Voir mon score" : "Question suivante"}
                            </button>
                        )}
                    </div>
                );
            }

            // Écran de Score
            if (gameState === 'score') {
                const percentage = Math.round((score / questions.length) * 100);
                let message = "Bien joué !";
                if (percentage === 100) message = "Parfait ! Un sans faute.";
                else if (percentage < 50) message = "Encore quelques efforts !";

                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Bilan</h2>
                            <p className="text-gray-500 mb-6">{message}</p>
                            
                            <div className="text-6xl font-black text-blue-600 mb-8">
                                {score} <span className="text-2xl text-gray-400">/ {questions.length}</span>
                            </div>

                            <button
                                onClick={() => setGameState('home')}
                                className="w-full bg-gray-200 text-gray-800 font-bold py-4 rounded-xl text-lg mb-3 hover:bg-gray-300"
                            >
                                Retour à l'accueil
                            </button>
                            <button
                                onClick={() => setGameState('theme')}
                                className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg"
                            >
                                Rejouer
                            </button>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
