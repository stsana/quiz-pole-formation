                {
                    question: "Quel rôle jouent les miracles du Christ dans l'acte de foi catholique ?",
                    options: ["Ils remplacent la nécessité de croire", "Ils sont des 'motifs de crédibilité' montrant que l'assentiment de la foi n'est pas aveugle", "Ils sont des illusions pour tromper les païens", "Ils ne sont que des allégories morales"],
                    correctIndex: 1,
                    explication: "Les miracles du Christ sont des signes certains de la Révélation, des 'motifs de crédibilité' montrant que la foi n'est nullement un mouvement aveugle de l'esprit."
                },
                {
                    question: "Contre les philosophies dualistes et panthéistes, quelle vérité concernant la Création est défendue ?",
                    options: ["Le monde est une émanation nécessaire de Dieu", "Le Bien et le Mal luttent éternellement à armes égales", "Dieu a créé le monde librement et 'de rien' (ex nihilo)", "La matière a toujours existé"],
                    correctIndex: 2,
                    explication: "La foi affirme que Dieu n'a pas besoin de matière préexistante ni n'émane de lui-même le monde, mais qu'il crée librement 'de rien'."
                },
                {
                    question: "En Apologétique, quelle est la véritable valeur du 'tombeau vide' au matin de Pâques ?",
                    options: ["C'est la preuve mathématique absolue de la résurrection", "C'est un signe essentiel qui fut le premier pas vers la reconnaissance du fait par les disciples", "C'est une fable inventée au 4ème siècle", "Il prouve que le corps a été volé"],
                    correctIndex: 1,
                    explication: "Le sépulcre vide n'est pas en soi une preuve directe, mais il a constitué un signe essentiel et le premier pas vers la foi en la Résurrection pour les apôtres."
                },
                {
                    question: "Que dénonce l'Église à travers la condamnation du 'millénarisme' politique ?",
                    options: ["L'utilisation du calendrier grégorien", "La falsification antichristique qui prétend accomplir définitivement le Royaume de Dieu dans l'histoire terrestre", "L'étude de l'an 1000", "Le rassemblement dominical"],
                    correctIndex: 1,
                    explication: "L'imposture antichristique est un messianisme sécularisé prétendant réaliser sur terre l'espérance qui ne peut s'achever qu'au-delà, par le Jugement divin."
                }
            ]
        };

        const themes = [
            { id: 'doctrine', label: 'Doctrine & Église', color: 'bg-blue-500' },
            { id: 'ecritures', label: 'Les Écritures', color: 'bg-green-600' },
            { id: 'pratique', label: 'La Vie Pratique', color: 'bg-purple-500' },
            { id: 'apologetique', label: 'Apologétique', color: 'bg-red-500' },
            { id: 'mix', label: 'Mix (Aléatoire)', color: 'bg-gray-800' }
        ];

        // Fonction pour mélanger un tableau aléatoirement (Fisher-Yates)
        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        // 2. COMPOSANT PRINCIPAL (APPLICATION)
        function App() {
            const [gameState, setGameState] = React.useState('home'); // home, theme, quiz, score
            const [questions, setQuestions] = React.useState([]);
            const [currentQIndex, setCurrentQIndex] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [selectedAnswer, setSelectedAnswer] = React.useState(null);

            const startQuiz = (themeId) => {
                let selectedQuestions = [];
                
                if (themeId === 'mix') {
                    const allQuestions = [
                        ...quizData.doctrine,
                        ...quizData.ecritures,
                        ...quizData.pratique,
                        ...quizData.apologetique
                    ];
                    selectedQuestions = shuffleArray(allQuestions).slice(0, 10); 
                } else {
                    selectedQuestions = shuffleArray(quizData[themeId]).slice(0, 10);
                }
                
                setQuestions(selectedQuestions);
                setCurrentQIndex(0);
                setScore(0);
                setSelectedAnswer(null);
                setGameState('quiz');
            };

            const handleAnswer = (index) => {
                if (selectedAnswer !== null) return; 
                setSelectedAnswer(index);
                if (index === questions[currentQIndex].correctIndex) {
                    setScore(score + 1);
                }
            };

            const nextQuestion = () => {
                if (currentQIndex + 1 < questions.length) {
                    setCurrentQIndex(currentQIndex + 1);
                    setSelectedAnswer(null);
                } else {
                    setGameState('score');
                }
            };

            if (gameState === 'home') {
                return (
                    <div className="min-h-[100dvh] flex flex-col items-center justify-center p-4">
                        <div className="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center">
                            <div className="flex flex-col items-center justify-center space-y-4 mb-6">
                                <img src="logo-upsc.png" alt="Logo Unité Pastorale Sainte-Croix" className="h-20 object-contain" />
                                <img src="logo-pole-formation.jpeg" alt="Logo Pôle Formation" className="h-32 object-contain rounded-full shadow-sm" />
                            </div>
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">Quiz Catholique</h1>
                            <p className="text-gray-500 mb-8">Testez vos connaissances sur la foi, la doctrine et les écritures.</p>
                            <button 
                                onClick={() => setGameState('theme')}
                                className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg active:scale-95 transition-transform"
                            >
                                Commencer
                            </button>
                        </div>
                    </div>
                );
            }

            if (gameState === 'theme') {
                return (
                    <div className="min-h-[100dvh] flex flex-col items-center justify-center p-4">
                        <div className="w-full max-w-md">
                            <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">Choisissez un thème</h2>
                            <div className="grid gap-4">
                                {themes.map((theme) => (
                                    <button
                                        key={theme.id}
                                        onClick={() => startQuiz(theme.id)}
                                        className={`${theme.color} text-white font-bold py-5 rounded-xl text-lg shadow-md active:scale-95 transition-transform`}
                                    >
                                        {theme.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (gameState === 'quiz') {
                const currentQuestion = questions[currentQIndex];
                const isAnswered = selectedAnswer !== null;

                return (
                    <div className="min-h-[100dvh] flex flex-col p-4 w-full max-w-md mx-auto relative">
                        {/* Barre de progression avec marges réduites */}
                        <div className="w-full bg-gray-200 rounded-full h-2 mb-4 mt-2">
                            <div className="bg-blue-600 h-2 rounded-full transition-all duration-300" style={{ width: `${((currentQIndex + 1) / questions.length) * 100}%` }}></div>
                        </div>
                        
                        {/* Zone de contenu : pb-24 empêche le texte d'être caché par le bouton fixe */}
                        <div className="flex-grow pb-24">
                            <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Question {currentQIndex + 1} / {questions.length}</span>
                            <h2 className="text-xl font-bold text-gray-800 mt-1 mb-5 leading-tight">{currentQuestion.question}</h2>

                            <div className="grid gap-2.5">
                                {currentQuestion.options.map((option, index) => {
                                    let buttonClass = "bg-white text-gray-800 border-2 border-gray-200";
                                    
                                    if (isAnswered) {
                                        if (index === currentQuestion.correctIndex) {
                                            buttonClass = "bg-green-500 text-white border-green-500";
                                        } else if (index === selectedAnswer) {
                                            buttonClass = "bg-red-500 text-white border-red-500";
                                        } else {
                                            buttonClass = "bg-gray-100 text-gray-400 border-gray-100 opacity-50";
                                        }
                                    } else {
                                        buttonClass += " hover:border-blue-400 active:bg-gray-50";
                                    }

                                    return (
                                        <button
                                            key={index}
                                            disabled={isAnswered}
                                            onClick={() => handleAnswer(index)}
                                            className={`p-3 rounded-xl text-left font-semibold text-[15px] transition-colors ${buttonClass}`}
                                        >
                                            {option}
                                        </button>
                                    );
                                })}
                            </div>

                            {isAnswered && (
                                <div className="mt-4 p-3.5 bg-blue-50 border border-blue-200 rounded-xl slide-up">
                                    <p className="text-blue-900 text-sm leading-snug"><strong>Explication :</strong> {currentQuestion.explication}</p>
                                </div>
                            )}
                        </div>

                        {/* Bandeau fixe en bas d'écran contenant le bouton de navigation */}
                        {isAnswered && (
                            <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/95 backdrop-blur shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-10 flex justify-center">
                                <div className="w-full max-w-md">
                                    <button
                                        onClick={nextQuestion}
                                        className="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl text-lg shadow-md active:scale-95 transition-transform"
                                    >
                                        {currentQIndex + 1 === questions.length ? "Voir mon score" : "Question suivante"}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (gameState === 'score') {
                const percentage = Math.round((score / questions.length) * 100);
                let message = "Bien joué !";
                if (percentage === 100) message = "Parfait ! Un sans faute.";
                else if (percentage < 50) message = "Encore quelques efforts !";

                return (
                    <div className="min-h-[100dvh] flex flex-col items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Bilan</h2>
                            <p className="text-gray-500 mb-6">{message}</p>
                            
                            <div className="text-6xl font-black text-blue-600 mb-8">
                                {score} <span className="text-2xl text-gray-400">/ {questions.length}</span>
                            </div>

                            <button
                                onClick={() => setGameState('home')}
                                className="w-full bg-gray-200 text-gray-800 font-bold py-4 rounded-xl text-lg mb-3 hover:bg-gray-300"
                            >
                                Retour à l'accueil
                            </button>
                            <button
                                onClick={() => setGameState('theme')}
                                className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg"
                            >
                                Rejouer
                            </button>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
