        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const normalizeText = (str) => {
            return str
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9\s]/g, " ")
                .replace(/\s+/g, " ")
                .trim();
        };

        const checkFuzzyMatch = (userInput, officialAnswer) => {
            const cleanInput = normalizeText(userInput);
            if (cleanInput.length < 3) return false;
            const cleanAnswer = normalizeText(officialAnswer);
            const stopWords = new Set(["le", "la", "les", "un", "une", "des", "du", "de", "d", "l", "ou", "saint", "sainte"]);
            const answerTokens = cleanAnswer.split(" ").filter((t) => t.length > 2 && !stopWords.has(t));
            const inputTokens = cleanInput.split(" ").filter((t) => t.length > 2 && !stopWords.has(t));
            if (answerTokens.length === 0) return cleanAnswer.includes(cleanInput);
            return answerTokens.some((tok) => inputTokens.includes(tok)) && (cleanAnswer.includes(cleanInput) || inputTokens.length >= Math.min(2, answerTokens.length));
        };

            </svg>
        );

        // =========================================================================
        // 4. COMPOSANT PRINCIPAL
        // =========================================================================
        function App() {
            const [gameState, setGameState] = React.useState('home');
            const [isDarkMode, setIsDarkMode] = React.useState(false);

            // États QCM
            const [qcmQuestions, setQcmQuestions] = React.useState([]);
            const [qcmIndex, setQcmIndex] = React.useState(0);
            const [qcmScore, setQcmScore] = React.useState(0);
            const [qcmSelectedAnswer, setQcmSelectedAnswer] = React.useState(null);

            // États Jeu Questions pour un Champion (4 Indices progressifs)
            const [qpucSelectedCat, setQpucSelectedCat] = React.useState('all');
            const [qpucRoundCount, setQpucRoundCount] = React.useState(10);
            const [qpucQuestions, setQpucQuestions] = React.useState([]);
            const [qpucIndex, setQpucIndex] = React.useState(0);
            const [revealedClues, setRevealedClues] = React.useState(1);
            const [userGuess, setUserGuess] = React.useState('');
            const [isQpucAnswerRevealed, setIsQpucAnswerRevealed] = React.useState(false);
            const [qpucPoints, setQpucPoints] = React.useState(0);
            const [qpucHistory, setQpucHistory] = React.useState([]);

            // États Page Révision QPUC
            const [reviewCat, setReviewCat] = React.useState('cat1');
            const [reviewSearch, setReviewSearch] = React.useState('');
            const [openAnswers, setOpenAnswers] = React.useState({});

            const toggleTheme = () => {
                const next = !isDarkMode;
                setIsDarkMode(next);
                if (next) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            };

            // --- LOGIQUE QCM ---
            const startQcm = (themeId) => {
                let selected = [];
                if (themeId === 'mix') {
                    const all = [
                        ...quizData.doctrine,
                        ...quizData.ecritures,
                        ...quizData.pratique,
                        ...quizData.apologetique
                    ];
                    selected = shuffleArray(all).slice(0, 12);
                } else {
                    selected = shuffleArray(quizData[themeId]).slice(0, 12);
                }
                setQcmQuestions(selected);
                setQcmIndex(0);
                setQcmScore(0);
                setQcmSelectedAnswer(null);
                setGameState('qcm_quiz');
            };

            const handleQcmAnswer = (index) => {
                if (qcmSelectedAnswer !== null) return;
                setQcmSelectedAnswer(index);
                if (index === qcmQuestions[qcmIndex].correctIndex) {
                    setQcmScore((s) => s + 1);
                }
            };

            const nextQcmQuestion = () => {
                if (qcmIndex + 1 < qcmQuestions.length) {
                    setQcmIndex((i) => i + 1);
                    setQcmSelectedAnswer(null);
                } else {
                    setGameState('qcm_score');
                }
            };

            // --- LOGIQUE JEU QUESTIONS POUR UN CHAMPION ---
            const startQpucGame = (categoryId = qpucSelectedCat, count = qpucRoundCount) => {
                const pool = categoryId === 'all'
                    ? allQpucQuestions
                    : (qpucCategories.find((c) => c.id === categoryId)?.questions || allQpucQuestions);
                const shuffled = shuffleArray(pool);
                const sliceCount = count === 'all' ? shuffled.length : Math.min(count, shuffled.length);
                setQpucQuestions(shuffled.slice(0, sliceCount));
                setQpucIndex(0);
                setRevealedClues(1);
                setUserGuess('');
                setIsQpucAnswerRevealed(false);
                setQpucPoints(0);
                setQpucHistory([]);
                setGameState('qpuc_game');
            };

            const revealNextClue = () => {
                if (revealedClues < 4 && !isQpucAnswerRevealed) {
                    setRevealedClues((c) => c + 1);
                }
            };

            const revealQpucSolution = () => {
                setIsQpucAnswerRevealed(true);
            };

            const recordQpucResult = (isCorrect) => {
                const potentialPts = 5 - revealedClues;
                const earned = isCorrect ? potentialPts : 0;
                setQpucPoints((p) => p + earned);
                setQpucHistory((prev) => [...prev, { pts: earned, clueLevel: revealedClues, correct: isCorrect }]);

                if (qpucIndex + 1 < qpucQuestions.length) {
                    setQpucIndex((i) => i + 1);
                    setRevealedClues(1);
                    setUserGuess('');
                    setIsQpucAnswerRevealed(false);
                } else {
                    setGameState('qpuc_score');
                }
            };

            // --- LOGIQUE RÉVISION QPUC ---
            const toggleReviewAnswer = (id) => {
                setOpenAnswers((prev) => ({ ...prev, [id]: !prev[id] }));
            };

            const filteredReviewQuestions = React.useMemo(() => {
                const base = reviewCat === 'all'
                    ? allQpucQuestions
                    : (qpucCategories.find((c) => c.id === reviewCat)?.questions || []);
                const q = normalizeText(reviewSearch);
                if (!q) return base;
                return base.filter((item) =>
                    normalizeText(item.sujet).includes(q) ||
                    normalizeText(item.reponse).includes(q) ||
                    item.indices.some((ind) => normalizeText(ind).includes(q))
                );
            }, [reviewCat, reviewSearch]);

            const setAllReviewAnswers = (stateBool) => {
                const next = {};
                filteredReviewQuestions.forEach((item) => {
                    next[item.id] = stateBool;
                });
                setOpenAnswers(next);
            };

            return (
                <div className="min-h-[100dvh] bg-gray-100 dark:bg-gray-900 transition-colors duration-300 font-sans text-gray-900 dark:text-gray-100 relative">
                    
                    {/* Barre supérieure fixe */}
                    <div className="fixed top-3 right-3 left-3 flex justify-between items-center pointer-events-none z-30 max-w-2xl mx-auto">
                        {gameState !== 'home' ? (
                            <button
                                onClick={() => setGameState('home')}
                                className="pointer-events-auto flex items-center gap-1.5 px-3 py-2 rounded-full bg-white/95 dark:bg-gray-800/95 shadow-md text-gray-700 dark:text-gray-200 text-xs font-bold hover:scale-105 active:scale-95 transition-all border border-gray-200 dark:border-gray-700"
                                aria-label="Retour à l'accueil"
                            >
                                <HomeIcon />
                                <span>Accueil</span>
                            </button>
                        ) : <div />}

                        <button 
                            onClick={toggleTheme} 
                            className="pointer-events-auto p-2.5 rounded-full bg-white/95 dark:bg-gray-800/95 shadow-md text-gray-700 dark:text-gray-200 hover:scale-105 active:scale-95 transition-all border border-gray-200 dark:border-gray-700"
                            aria-label="Basculer le thème"
                        >
                            {isDarkMode ? <SunIcon /> : <MoonIcon />}
                        </button>
                    </div>

                    {/* ============================================================= */}
                    {/* ÉCRAN 1 : ACCUEIL                                             */}
                    {/* ============================================================= */}
                    {gameState === 'home' && (
                        <div className="min-h-[100dvh] flex flex-col items-center justify-center p-4 pt-14">
                            <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-xl w-full max-w-md text-center transition-colors duration-300 border border-gray-100 dark:border-gray-700">
                                <div className="flex flex-col items-center justify-center space-y-3 mb-5">
                                    <div className="bg-white p-2 rounded-xl">
                                        <img src="logo-upsc.png" alt="Logo Unité Pastorale Sainte-Croix" className="h-14 object-contain" />
                                    </div>
                                    <img src="logo-pole-formation.jpeg" alt="Logo Pôle Formation" className="h-24 object-contain rounded-full shadow-sm border-2 border-white" />
                                </div>
                                <h1 className="text-2xl font-extrabold text-gray-800 dark:text-white mb-1">Quiz Sainte-Croix</h1>
                                <p className="text-sm text-gray-500 dark:text-gray-300 mb-6">Formation, Bible, Saints et Catéchisme de l'Église Catholique</p>

                                <div className="space-y-3">
                                    <button 
                                        onClick={() => setGameState('qpuc_theme')}
                                        className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg active:scale-95 transition-all flex flex-col items-center"
                                    >
                                        <span className="text-lg">Questions pour un Champion</span>
                                        <span className="text-xs font-normal text-amber-100 mt-0.5">Jeu à 4 indices progressifs • 7 grandes catégories</span>
                                    </button>

                                    <button 
                                        onClick={() => setGameState('qcm_theme')}
                                        className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg active:scale-95 transition-all flex flex-col items-center"
                                    >
                                        <span className="text-lg">Quiz QCM Classique</span>
                                        <span className="text-xs font-normal text-blue-100 mt-0.5">48 questions sourcées CEC & Bible avec explications</span>
                                    </button>

                                    <button 
                                        onClick={() => setGameState('qpuc_review')}
                                        className="w-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-100 font-bold py-3.5 px-4 rounded-xl border border-gray-300 dark:border-gray-600 active:scale-95 transition-all flex flex-col items-center"
                                    >
                                        <span className="text-base">Fiches Révision (120 Questions)</span>
                                        <span className="text-xs font-normal text-gray-500 dark:text-gray-400 mt-0.5">Parcourir les 7 catégories et leurs solutions</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ============================================================= */}
                    {/* ÉCRAN 2 : SÉLECTION THÈME QCM                                 */}
                    {/* ============================================================= */}
                    {gameState === 'qcm_theme' && (
                        <div className="min-h-[100dvh] flex flex-col items-center justify-center p-4 pt-16">
                            <div className="w-full max-w-md">
                                <h2 className="text-2xl font-bold text-gray-800 dark:text-white mb-2 text-center">Quiz QCM — Thèmes</h2>
                                <p className="text-sm text-gray-500 dark:text-gray-400 mb-6 text-center">12 questions à choix multiples par session</p>
                                <div className="grid gap-3.5">
                                    {qcmThemes.map((theme) => (
                                        <button
                                            key={theme.id}
                                            onClick={() => startQcm(theme.id)}
                                            className={`${theme.color} text-white font-bold py-4 rounded-xl text-lg shadow-md hover:brightness-110 active:scale-95 transition-all`}
                                        >
                                            {theme.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ============================================================= */}
                    {/* ÉCRAN 3 : JEU QCM                                             */}
                    {/* ============================================================= */}
                    {gameState === 'qcm_quiz' && (
                        <div className="min-h-[100dvh] flex flex-col p-4 w-full max-w-md mx-auto relative pt-16">
                            <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 mb-4">
                                <div className="bg-blue-600 h-2 rounded-full transition-all duration-300" style={{ width: `${((qcmIndex + 1) / qcmQuestions.length) * 100}%` }}></div>
                            </div>
                            
                            <div className="flex-grow pb-24">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">Question {qcmIndex + 1} / {qcmQuestions.length}</span>
                                    <span className="text-xs font-bold text-blue-600 dark:text-blue-400">Score : {qcmScore}</span>
                                </div>
                                <h2 className="text-xl font-bold text-gray-800 dark:text-white mt-1.5 mb-5 leading-tight">{qcmQuestions[qcmIndex].question}</h2>

                                <div className="grid gap-2.5">
                                    {qcmQuestions[qcmIndex].options.map((option, index) => {
                                        let buttonClass = "bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 border-2 border-gray-200 dark:border-gray-600";
                                        if (qcmSelectedAnswer !== null) {
                                            if (index === qcmQuestions[qcmIndex].correctIndex) {
                                                buttonClass = "bg-green-500 dark:bg-green-600 text-white border-green-500 dark:border-green-600";
                                            } else if (index === qcmSelectedAnswer) {
                                                buttonClass = "bg-red-500 dark:bg-red-600 text-white border-red-500 dark:border-red-600";
                                            } else {
                                                buttonClass = "bg-gray-100 dark:bg-gray-800/50 text-gray-400 dark:text-gray-500 border-gray-100 dark:border-gray-700 opacity-50";
                                            }
                                        } else {
                                            buttonClass += " hover:border-blue-400 dark:hover:border-blue-500 active:bg-gray-50 dark:active:bg-gray-700";
                                        }

                                        return (
                                            <button
                                                key={index}
                                                disabled={qcmSelectedAnswer !== null}
                                                onClick={() => handleQcmAnswer(index)}
                                                className={`p-3.5 rounded-xl text-left font-semibold text-[15px] transition-colors ${buttonClass}`}
                                            >
                                                {option}
                                            </button>
                                        );
                                    })}
                                </div>

                                {qcmSelectedAnswer !== null && (
                                    <div className="mt-4 p-3.5 bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 rounded-xl slide-up">
                                        <p className="text-blue-900 dark:text-blue-200 text-sm leading-snug"><strong>Explication :</strong> {qcmQuestions[qcmIndex].explication}</p>
                                    </div>
                                )}
                            </div>

                            {qcmSelectedAnswer !== null && (
                                <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/95 dark:bg-gray-900/95 backdrop-blur shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] dark:border-t dark:border-gray-800 z-10 flex justify-center">
                                    <div className="w-full max-w-md">
                                        <button
                                            onClick={nextQcmQuestion}
                                            className="w-full bg-gray-900 dark:bg-blue-600 text-white font-bold py-3.5 rounded-xl text-lg shadow-md hover:bg-gray-800 dark:hover:bg-blue-700 active:scale-95 transition-all"
                                        >
                                            {qcmIndex + 1 === qcmQuestions.length ? "Voir mon score" : "Question suivante"}
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ============================================================= */}
                    {/* ÉCRAN 4 : SCORE QCM                                           */}
                    {/* ============================================================= */}
                    {gameState === 'qcm_score' && (
                        <div className="min-h-[100dvh] flex flex-col items-center justify-center p-4 pt-16">
                            <div className="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
                                <h2 className="text-3xl font-bold text-gray-800 dark:text-white mb-2">Bilan QCM</h2>
                                <p className="text-gray-500 dark:text-gray-300 mb-6">
                                    {qcmScore === qcmQuestions.length ? "Parfait ! Un sans-faute." : qcmScore < qcmQuestions.length / 2 ? "Encore quelques révisions !" : "Bien joué !"}
                                </p>
                                <div className="text-6xl font-black text-blue-600 dark:text-blue-400 mb-8">
                                    {qcmScore} <span className="text-2xl text-gray-400 dark:text-gray-500">/ {qcmQuestions.length}</span>
                                </div>
                                <button
                                    onClick={() => setGameState('qcm_theme')}
                                    className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg hover:bg-blue-700 mb-3 transition-colors"
                                >
                                    Rejouer un QCM
                                </button>
                                <button
                                    onClick={() => setGameState('home')}
                                    className="w-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-bold py-4 rounded-xl text-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors"
                                >
                                    Retour à l'accueil
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ============================================================= */}
                    {/* ÉCRAN 5 : CONFIGURATION JEU QUESTIONS POUR UN CHAMPION (7 CAT) */}
                    {/* ============================================================= */}
                    {gameState === 'qpuc_theme' && (
                        <div className="min-h-[100dvh] flex flex-col items-center p-4 pt-16 pb-10">
                            <div className="w-full max-w-lg">
                                <div className="text-center mb-5">
                                    <span className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300 mb-2">
                                        Barème : Indice 1 = 4 pts • Indice 2 = 3 pts • Indice 3 = 2 pts • Indice 4 = 1 pt
                                    </span>
                                    <h2 className="text-2xl font-extrabold text-gray-800 dark:text-white">Questions pour un Champion</h2>
                                    <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">Choisissez le format et l'une des 7 grandes catégories</p>
                                </div>

                                {/* Sélecteur du nombre de questions */}
                                <div className="bg-white dark:bg-gray-800 p-3.5 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 mb-4">
                                    <p className="text-xs font-bold uppercase text-gray-400 dark:text-gray-500 mb-2">Longueur de la partie</p>
                                    <div className="grid grid-cols-3 gap-2">
                                        {[
                                            { val: 5, label: '5 questions' },
                                            { val: 10, label: '10 questions' },
                                            { val: 'all', label: 'Tout le thème' }
                                        ].map((opt) => (
                                            <button
                                                key={String(opt.val)}
                                                onClick={() => setQpucRoundCount(opt.val)}
                                                className={`py-2 px-2 rounded-lg text-xs font-bold border transition-all ${
                                                    qpucRoundCount === opt.val
                                                        ? 'bg-amber-600 text-white border-amber-600 shadow-sm'
                                                        : 'bg-gray-50 dark:bg-gray-700 text-gray-700 dark:text-gray-200 border-gray-200 dark:border-gray-600'
                                                }`}
                                            >
                                                {opt.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Bouton Mix Global */}
                                <button
                                    onClick={() => {
                                        setQpucSelectedCat('all');
                                        startQpucGame('all', qpucRoundCount === 'all' ? 20 : qpucRoundCount);
                                    }}
                                    className="w-full bg-gradient-to-r from-amber-600 to-orange-600 hover:brightness-110 text-white font-bold py-4 px-4 rounded-xl shadow-md active:scale-95 transition-all mb-4 flex items-center justify-between"
                                >
                                    <div className="text-left">
                                        <div className="text-base">Toutes les catégories (Mix Aléatoire)</div>
                                        <div className="text-xs text-amber-100 font-normal">
                                            {qpucRoundCount === 'all' ? '20 questions tirées parmi les 120' : `${qpucRoundCount} questions tirées parmi les 120`}
                                        </div>
                                    </div>
                                    <span className="text-xl">→</span>
                                </button>

                                {/* Liste des 7 grandes catégories */}
                                <div className="space-y-2.5">
                                    {qpucCategories.map((cat) => (
                                        <button
                                            key={cat.id}
                                            onClick={() => {
                                                setQpucSelectedCat(cat.id);
                                                startQpucGame(cat.id, qpucRoundCount);
                                            }}
                                            className="w-full bg-white dark:bg-gray-800 hover:border-amber-500 dark:hover:border-amber-500 border-2 border-gray-200 dark:border-gray-700 p-3.5 rounded-xl text-left shadow-sm active:scale-[0.99] transition-all flex items-center justify-between gap-3"
                                        >
                                            <div>
                                                <div className="font-bold text-sm text-gray-800 dark:text-gray-100 leading-snug">{cat.title}</div>
                                                <div className="text-xs text-gray-500 dark:text-gray-400 mt-0.5">{cat.subtitle}</div>
                                            </div>
                                            <span className="shrink-0 text-xs font-bold px-2.5 py-1 rounded-full bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-300">
                                                {cat.questions.length} Q
                                            </span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ============================================================= */}
                    {/* ÉCRAN 6 : PARTIE EN COURS — QUESTIONS POUR UN CHAMPION        */}
                    {/* ============================================================= */}
                    {gameState === 'qpuc_game' && qpucQuestions.length > 0 && (() => {
                        const currentItem = qpucQuestions[qpucIndex];
                        const currentPotentialPts = 5 - revealedClues;
                        const isAutoMatched = isQpucAnswerRevealed && userGuess.trim() !== '' && checkFuzzyMatch(userGuess, currentItem.reponse);

                        return (
                            <div className="min-h-[100dvh] flex flex-col p-4 w-full max-w-lg mx-auto relative pt-16">
                                {/* En-tête progression & score */}
                                <div className="flex items-center justify-between text-xs font-bold mb-2">
                                    <span className="text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                        Question {qpucIndex + 1} / {qpucQuestions.length}
                                    </span>
                                    <div className="flex items-center gap-2">
                                        {!isQpucAnswerRevealed && (
                                            <span className="px-2.5 py-1 rounded-full bg-amber-100 dark:bg-amber-900/50 text-amber-800 dark:text-amber-300">
                                                En jeu : {currentPotentialPts} pt{currentPotentialPts > 1 ? 's' : ''}
                                            </span>
                                        )}
                                        <span className="px-2.5 py-1 rounded-full bg-blue-100 dark:bg-blue-900/50 text-blue-800 dark:text-blue-300">
                                            Score : {qpucPoints} pt{qpucPoints > 1 ? 's' : ''}
                                        </span>
                                    </div>
                                </div>

                                <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2 mb-3">
                                    <div
                                        className="bg-amber-500 h-2 rounded-full transition-all duration-300"
                                        style={{ width: `${((qpucIndex + 1) / qpucQuestions.length) * 100}%` }}
                                    ></div>
                                </div>

                                {/* Badge catégorie */}
                                <div className="text-[11px] font-semibold text-amber-700 dark:text-amber-400 mb-3 truncate">
                                    {currentItem.categoryTitle}
                                </div>

                                {/* Zone des indices progressifs */}
                                <div className="flex-grow pb-36 space-y-3">
                                    {currentItem.indices.map((indiceText, idx) => {
                                        const clueNumber = idx + 1;
                                        const isVisible = isQpucAnswerRevealed || clueNumber <= revealedClues;
                                        const cluePtsValue = 5 - clueNumber;

                                        if (!isVisible) {
                                            return (
                                                <div
                                                    key={idx}
                                                    className="p-3 rounded-xl border border-dashed border-gray-300 dark:border-gray-700 bg-gray-50/70 dark:bg-gray-800/40 flex items-center justify-between text-xs text-gray-400 dark:text-gray-500"
                                                >
                                                    <span>Indice {clueNumber} verrouillé</span>
                                                    <span>({cluePtsValue} pt{cluePtsValue > 1 ? 's' : ''})</span>
                                                </div>
                                            );
                                        }

                                        return (
                                            <div
                                                key={idx}
                                                className="p-3.5 rounded-xl bg-white dark:bg-gray-800 border-l-4 border-amber-500 shadow-sm slide-up"
                                            >
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="text-xs font-extrabold uppercase tracking-wider text-amber-600 dark:text-amber-400">
                                                        Indice {clueNumber} / 4
                                                    </span>
                                                    <span className="text-[11px] font-semibold text-gray-400 dark:text-gray-500">
                                                        {cluePtsValue} pt{cluePtsValue > 1 ? 's' : ''}
                                                    </span>
                                                </div>
                                                <p className="text-sm sm:text-[15px] text-gray-800 dark:text-gray-100 leading-relaxed">
                                                    {indiceText}
                                                </p>
                                            </div>
                                        );
                                    })}

                                    {/* Champ de saisie facultatif avant révélation */}
                                    {!isQpucAnswerRevealed && (
                                        <div className="pt-2">
                                            <input
                                                type="text"
                                                value={userGuess}
                                                onChange={(e) => setUserGuess(e.target.value)}
                                                onKeyDown={(e) => {
                                                    if (e.key === 'Enter') revealQpucSolution();
                                                }}
                                                placeholder="Votre proposition (facultatif)..."
                                                className="w-full px-3.5 py-3 rounded-xl bg-white dark:bg-gray-800 border-2 border-gray-200 dark:border-gray-600 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-amber-500"
                                            />
                                        </div>
                                    )}

                                    {/* Carte Solution révélée */}
                                    {isQpucAnswerRevealed && (
                                        <div className="mt-4 p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/60 border-2 border-emerald-500 shadow-md slide-up">
                                            <div className="text-xs font-bold uppercase tracking-wider text-emerald-700 dark:text-emerald-400 mb-1">
                                                Réponse officielle ({currentItem.sujet})
                                            </div>
                                            <div className="text-xl font-black text-emerald-900 dark:text-emerald-100">
                                                {currentItem.reponse}
                                            </div>

                                            {userGuess.trim() !== '' && (
                                                <div className="mt-2 pt-2 border-t border-emerald-200 dark:border-emerald-800 text-xs">
                                                    <span className="text-gray-600 dark:text-gray-300">Votre proposition : <strong>{userGuess}</strong></span>
                                                    {isAutoMatched && (
                                                        <span className="ml-2 inline-block px-2 py-0.5 rounded bg-emerald-200 dark:bg-emerald-800 text-emerald-900 dark:text-emerald-100 font-bold">
                                                            Correspondance !
                                                        </span>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>

                                {/* Bandeau d'actions fixe en bas d'écran */}
                                <div className="fixed bottom-0 left-0 right-0 p-3.5 bg-white/95 dark:bg-gray-900/95 backdrop-blur shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.08)] dark:border-t dark:border-gray-800 z-20 flex justify-center">
                                    <div className="w-full max-w-lg">
                                        {!isQpucAnswerRevealed ? (
                                            <div className="grid grid-cols-2 gap-2.5">
                                                <button
                                                    onClick={revealNextClue}
                                                    disabled={revealedClues >= 4}
                                                    className={`py-3.5 px-3 rounded-xl font-bold text-sm sm:text-base transition-all ${
                                                        revealedClues >= 4
                                                            ? 'bg-gray-200 dark:bg-gray-800 text-gray-400 dark:text-gray-600 cursor-not-allowed'
                                                            : 'bg-amber-100 dark:bg-amber-900/50 text-amber-900 dark:text-amber-200 border border-amber-300 dark:border-amber-700 active:scale-95'
                                                    }`}
                                                >
                                                    {revealedClues >= 4 ? 'Dernier indice (1 pt)' : `Indice suivant (${4 - revealedClues} pt${4 - revealedClues > 1 ? 's' : ''})`}
                                                </button>
                                                <button
                                                    onClick={revealQpucSolution}
                                                    className="py-3.5 px-3 rounded-xl font-bold text-sm sm:text-base bg-gray-900 dark:bg-amber-600 text-white shadow-md active:scale-95 transition-all"
                                                >
                                                    Révéler la réponse
                                                </button>
                                            </div>
                                        ) : (
                                            <div>
                                                <p className="text-center text-xs font-bold text-gray-500 dark:text-gray-400 mb-2">
                                                    Avez-vous trouvé la bonne réponse à l'indice {revealedClues} ?
                                                </p>
                                                <div className="grid grid-cols-2 gap-2.5">
                                                    <button
                                                        onClick={() => recordQpucResult(false)}
                                                        className="py-3.5 px-3 rounded-xl font-bold text-sm sm:text-base bg-red-600 hover:bg-red-700 text-white shadow active:scale-95 transition-all"
                                                    >
                                                        Non / Passé (0 pt)
                                                    </button>
                                                    <button
                                                        onClick={() => recordQpucResult(true)}
                                                        className="py-3.5 px-3 rounded-xl font-bold text-sm sm:text-base bg-emerald-600 hover:bg-emerald-700 text-white shadow active:scale-95 transition-all"
                                                    >
                                                        Oui ! (+{currentPotentialPts} pt{currentPotentialPts > 1 ? 's' : ''})
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ============================================================= */}
                    {/* ÉCRAN 7 : BILAN JEU QUESTIONS POUR UN CHAMPION                */}
                    {/* ============================================================= */}
                    {gameState === 'qpuc_score' && (() => {
                        const maxPoints = qpucQuestions.length * 4;
                        const foundCount = qpucHistory.filter((h) => h.correct).length;
                        const c1 = qpucHistory.filter((h) => h.correct && h.clueLevel === 1).length;
                        const c2 = qpucHistory.filter((h) => h.correct && h.clueLevel === 2).length;
                        const c3 = qpucHistory.filter((h) => h.correct && h.clueLevel === 3).length;
                        const c4 = qpucHistory.filter((h) => h.correct && h.clueLevel === 4).length;

                        return (
                            <div className="min-h-[100dvh] flex flex-col items-center justify-center p-4 pt-16">
                                <div className="bg-white dark:bg-gray-800 p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-md text-center border border-gray-100 dark:border-gray-700">
                                    <span className="text-xs font-extrabold uppercase tracking-wider text-amber-600 dark:text-amber-400">
                                        Questions pour un Champion
                                    </span>
                                    <h2 className="text-2xl font-extrabold text-gray-800 dark:text-white mt-1 mb-2">Bilan de la partie</h2>
                                    <p className="text-sm text-gray-500 dark:text-gray-300 mb-5">
                                        {foundCount} bonne{foundCount > 1 ? 's' : ''} réponse{foundCount > 1 ? 's' : ''} sur {qpucQuestions.length} question{qpucQuestions.length > 1 ? 's' : ''}
                                    </p>

                                    <div className="text-5xl font-black text-amber-600 dark:text-amber-400 mb-6">
                                        {qpucPoints} <span className="text-xl text-gray-400 dark:text-gray-500">/ {maxPoints} pts</span>
                                    </div>

                                    <div className="grid grid-cols-4 gap-2 mb-6 text-xs">
                                        <div className="p-2 rounded-xl bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800">
                                            <div className="font-black text-base text-amber-700 dark:text-amber-300">{c1}</div>
                                            <div className="text-gray-500 dark:text-gray-400">Ind. 1 (4p)</div>
                                        </div>
                                        <div className="p-2 rounded-xl bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800">
                                            <div className="font-black text-base text-amber-700 dark:text-amber-300">{c2}</div>
                                            <div className="text-gray-500 dark:text-gray-400">Ind. 2 (3p)</div>
                                        </div>
                                        <div className="p-2 rounded-xl bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800">
                                            <div className="font-black text-base text-amber-700 dark:text-amber-300">{c3}</div>
                                            <div className="text-gray-500 dark:text-gray-400">Ind. 3 (2p)</div>
                                        </div>
                                        <div className="p-2 rounded-xl bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800">
                                            <div className="font-black text-base text-amber-700 dark:text-amber-300">{c4}</div>
                                            <div className="text-gray-500 dark:text-gray-400">Ind. 4 (1p)</div>
                                        </div>
                                    </div>

                                    <button
                                        onClick={() => startQpucGame(qpucSelectedCat, qpucSelectedCat === 'all' && qpucRoundCount === 'all' ? 20 : qpucRoundCount)}
                                        className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl text-base shadow-lg mb-2.5 transition-colors"
                                    >
                                        Rejouer cette sélection
                                    </button>
                                    <button
                                        onClick={() => setGameState('qpuc_theme')}
                                        className="w-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-100 font-bold py-3.5 rounded-xl text-base mb-2.5 transition-colors"
                                    >
                                        Changer de catégorie
                                    </button>
                                    <button
                                        onClick={() => setGameState('home')}
                                        className="w-full text-sm font-semibold text-gray-500 dark:text-gray-400 py-2 hover:underline"
                                    >
                                        Retour à l'accueil
                                    </button>
                                </div>
                            </div>
                        );
                    })()}

                    {/* ============================================================= */}
                    {/* ÉCRAN 8 : PAGE RÉVISION — TOUTES LES QUESTIONS & RÉPONSES     */}
                    {/* ============================================================= */}
                    {gameState === 'qpuc_review' && (
                        <div className="min-h-[100dvh] flex flex-col p-4 pt-16 pb-12 max-w-2xl mx-auto">
                            <div className="mb-4">
                                <h2 className="text-2xl font-extrabold text-gray-800 dark:text-white">Fiches Révision (120 Questions)</h2>
                                <p className="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
                                    Sélectionnez l'une des 7 grandes catégories ou recherchez un thème pour consulter les indices et la solution.
                                </p>
                            </div>

                            {/* Sélecteur de catégorie + Barre de recherche */}
                            <div className="bg-white dark:bg-gray-800 p-3.5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 mb-4 space-y-3">
                                <div>
                                    <label className="block text-[11px] font-bold uppercase text-gray-400 dark:text-gray-500 mb-1">
                                        Grande Catégorie
                                    </label>
                                    <select
                                        value={reviewCat}
                                        onChange={(e) => setReviewCat(e.target.value)}
                                        className="w-full p-2.5 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-sm font-semibold text-gray-800 dark:text-gray-100 focus:outline-none focus:border-amber-500"
                                    >
                                        <option value="all">Toutes les catégories (120 questions)</option>
                                        {qpucCategories.map((cat) => (
                                            <option key={cat.id} value={cat.id}>
                                                {cat.title} ({cat.questions.length})
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <div className="flex flex-col sm:flex-row gap-2">
                                    <input
                                        type="text"
                                        value={reviewSearch}
                                        onChange={(e) => setReviewSearch(e.target.value)}
                                        placeholder="Rechercher un saint, un concile, un livre..."
                                        className="flex-grow px-3 py-2 rounded-xl bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-sm text-gray-800 dark:text-gray-100 focus:outline-none focus:border-amber-500"
                                    />
                                    <div className="flex gap-2 shrink-0">
                                        <button
                                            onClick={() => setAllReviewAnswers(true)}
                                            className="px-3 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700"
                                        >
                                            Tout afficher
                                        </button>
                                        <button
                                            onClick={() => setAllReviewAnswers(false)}
                                            className="px-3 py-2 rounded-xl bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-gray-100 text-xs font-bold hover:bg-gray-300"
                                        >
                                            Tout masquer
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Compteur de résultats */}
                            <div className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-3">
                                {filteredReviewQuestions.length} question{filteredReviewQuestions.length > 1 ? 's' : ''} affichée{filteredReviewQuestions.length > 1 ? 's' : ''}
                            </div>

                            {/* Liste des fiches */}
                            <div className="space-y-4">
                                {filteredReviewQuestions.map((item, idx) => {
                                    const isOpen = !!openAnswers[item.id];
                                    return (
                                        <div
                                            key={item.id}
                                            className="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700"
                                        >
                                            <div className="flex items-start justify-between gap-2 mb-2">
                                                <div>
                                                    <span className="text-[11px] font-bold text-amber-600 dark:text-amber-400 block">
                                                        {item.categoryTitle}
                                                    </span>
                                                    <h3 className="text-base font-extrabold text-gray-800 dark:text-white">
                                                        {idx + 1}. {item.sujet}
                                                    </h3>
                                                </div>
                                            </div>

                                            <ul className="space-y-1.5 text-xs sm:text-sm text-gray-700 dark:text-gray-300 my-3">
                                                {item.indices.map((ind, i) => (
                                                    <li key={i} className="leading-snug">
                                                        <strong className="text-amber-700 dark:text-amber-400">Indice {i + 1} :</strong> {ind}
                                                    </li>
                                                ))}
                                            </ul>

                                            <button
                                                onClick={() => toggleReviewAnswer(item.id)}
                                                className={`w-full py-2.5 px-3 rounded-xl text-xs font-bold transition-colors ${
                                                    isOpen
                                                        ? 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-200 border border-emerald-300 dark:border-emerald-700'
                                                        : 'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600'
                                                }`}
                                            >
                                                {isOpen ? `Réponse : ${item.reponse}` : 'Afficher la réponse'}
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
