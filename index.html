        // Utilitaire de mélange Fisher-Yates
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

                                                            </span>
                                                            <span>{indice}</span>
                                                        </div>
                                                    ))}
                                                </div>

                                                {/* Solution / Réponse */}
                                                {visible ? (

                                                ) : (

                                                    >

                                                )}
                                            </article>
                                        );
                                    })}
                                </div>

                        ))
                    )}

            );
        }

        // =========================================================================
        // 4. APPLICATION PRINCIPALE (ACCUEIL + QUIZ QCM + PAGE QUESTIONS & RÉPONSES)
        // =========================================================================
        function App() {
            const [darkMode, setDarkMode] = useState(false);
            const [page, setPage] = useState("home"); // "home" | "quiz" | "qpuc"
            const [activeQuestions, setActiveQuestions] = useState([]);
            const [quizTitle, setQuizTitle] = useState("");
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);

            useEffect(() => {
                const root = document.documentElement;
                if (darkMode) root.classList.add("dark");
                else root.classList.remove("dark");
            }, [darkMode]);

            const startQuiz = (catId) => {
                let pool = [];
                let title = "";
                if (catId === "all") {
                    pool = Object.values(quizData).flat();
                    title = "Défi Général (Toutes catégories)";
                } else {
                    pool = quizData[catId] || [];
                    const found = quizCategoriesMeta.find((c) => c.id === catId);
                    title = found ? found.title : "Quiz";
                }
                setActiveQuestions(shuffleArray(pool));
                setQuizTitle(title);
                setCurrentIndex(0);
                setSelectedOption(null);
                setScore(0);
                setFinished(false);
                setPage("quiz");
            };

            const handleAnswer = (optIdx) => {
                if (selectedOption !== null) return;
                setSelectedOption(optIdx);
                if (optIdx === activeQuestions[currentIndex].correctIndex) {
                    setScore((s) => s + 1);
                }
            };

            const nextQuestion = () => {
                if (currentIndex + 1 < activeQuestions.length) {
                    setCurrentIndex((i) => i + 1);
                    setSelectedOption(null);
                } else {
                    setFinished(true);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Barre de navigation supérieure */}
                    <header className="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
                            <button
                                onClick={() => setPage("home")}
                                className="flex items-center gap-2.5 text-left font-extrabold text-lg text-slate-900 dark:text-white tracking-tight"
                            >
                                <span className="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-sm font-black shadow-sm">
                                    ✝
                                </span>
                                <span>Quiz Sainte-Croix</span>
                            </button>

                            <nav className="flex items-center gap-2">
                                <button
                                    onClick={() => setPage("home")}
                                    className={`px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition ${
                                        page === "home" || page === "quiz"
                                            ? "bg-indigo-600 text-white"
                                            : "text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
                                    }`}
                                >
                                    Quiz QCM
                                </button>
                                <button
                                    onClick={() => setPage("qpuc")}
                                    className={`px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition ${
                                        page === "qpuc"
                                            ? "bg-amber-600 text-white"
                                            : "text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
                                    }`}
                                >
                                    Questions &amp; Réponses
                                </button>
                                <button
                                    onClick={() => setDarkMode((d) => !d)}
                                    aria-label="Changer le thème"
                                    className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition"
                                >
                                    {darkMode ? "☀️" : "🌙"}
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Contenu principal */}
                    <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-6 sm:py-8">
                        {page === "qpuc" && (
                            <CatalogueQPUC onBack={() => setPage("home")} />
                        )}

                        {page === "home" && (
                            <div className="slide-up space-y-6">
                                {/* Bannière d'accès rapide au document Questions pour un Champion */}
                                <div className="bg-gradient-to-r from-amber-500 to-orange-600 rounded-2xl p-6 text-white shadow-md">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                        <div>
                                            <span className="inline-block text-xs font-bold uppercase tracking-wider bg-white/20 px-2.5 py-1 rounded-full mb-2">
                                                Nouveau • Document complet intégré
                                            </span>
                                            <h2 className="text-xl sm:text-2xl font-extrabold">
                                                Questions pour un Champion (120 fiches)
                                            </h2>
                                            <p className="text-sm text-amber-50 mt-1">
                                                Parcourez les 14 catégories thématiques, consultez les 4 indices de chaque question et accédez à toutes les solutions.
                                            </p>
                                        </div>
                                        <button
                                            onClick={() => setPage("qpuc")}
                                            className="shrink-0 bg-white text-amber-900 hover:bg-amber-50 font-bold text-sm px-5 py-3 rounded-xl shadow transition"
                                        >
                                            Ouvrir les 120 questions →
                                        </button>
                                    </div>
                                </div>

                                {/* Section Quiz QCM classique */}
                                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                                    <h1 className="text-2xl font-extrabold text-slate-900 dark:text-white">
                                        Mode Quiz QCM
                                    </h1>
                                    <p className="text-sm text-slate-600 dark:text-slate-400 mt-1 mb-5">
                                        Testez vos connaissances avec correction immédiate et références au Catéchisme de l'Église catholique.
                                    </p>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                        {quizCategoriesMeta.map((cat) => (
                                            <button
                                                key={cat.id}
                                                onClick={() => startQuiz(cat.id)}
                                                className="text-left p-4 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-indigo-500 dark:hover:border-indigo-500 bg-slate-50/70 dark:bg-slate-800/60 hover:bg-indigo-50/50 dark:hover:bg-slate-800 transition group"
                                            >
                                                <div className="flex items-center justify-between">
                                                    <span className="font-bold text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400">
                                                        {cat.title}
                                                    </span>
                                                    <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300">
                                                        {(quizData[cat.id] || []).length} Q
                                                    </span>
                                                </div>
                                                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                                                    {cat.desc}
                                                </p>
                                            </button>
                                        ))}
                                    </div>

                                    <button
                                        onClick={() => startQuiz("all")}
                                        className="mt-4 w-full py-3.5 px-5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-sm transition"
                                    >
                                        Lancer le Défi Général Aléatoire ({Object.values(quizData).flat().length} questions)
                                    </button>
                                </div>
                            </div>
                        )}

                        {page === "quiz" && activeQuestions.length > 0 && (
                            <div className="slide-up max-w-2xl mx-auto">
                                {!finished ? (
                                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                                        <div className="flex items-center justify-between text-xs font-semibold text-slate-500 dark:text-slate-400 mb-3">
                                            <span>{quizTitle}</span>
                                            <span>Question {currentIndex + 1} / {activeQuestions.length}</span>
                                        </div>
                                        <div className="w-full h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mb-6">
                                            <div
                                                className="h-full bg-indigo-600 transition-all duration-300"
                                                style={{ width: `${((currentIndex + 1) / activeQuestions.length) * 100}%` }}
                                            />
                                        </div>

                                        <h2 className="text-lg sm:text-xl font-bold text-slate-900 dark:text-white mb-5">
                                            {activeQuestions[currentIndex].question}
                                        </h2>

                                        <div className="space-y-2.5">
                                            {activeQuestions[currentIndex].options.map((opt, idx) => {
                                                const isCorrect = idx === activeQuestions[currentIndex].correctIndex;
                                                const isSelected = selectedOption === idx;
                                                let btnClass = "border-slate-200 dark:border-slate-700 hover:border-indigo-500 bg-slate-50 dark:bg-slate-800/70";
                                                if (selectedOption !== null) {
                                                    if (isCorrect) btnClass = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-900 dark:text-emerald-200 font-semibold";
                                                    else if (isSelected) btnClass = "border-rose-500 bg-rose-50 dark:bg-rose-950/50 text-rose-900 dark:text-rose-200";
                                                    else btnClass = "border-slate-200 dark:border-slate-800 opacity-60";
                                                }
                                                return (
                                                    <button
                                                        key={idx}
                                                        onClick={() => handleAnswer(idx)}
                                                        disabled={selectedOption !== null}
                                                        className={`w-full text-left p-3.5 rounded-xl border text-sm sm:text-base transition ${btnClass}`}
                                                    >
                                                        {opt}
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        {selectedOption !== null && (
                                            <div className="mt-5 p-4 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800/50 text-sm text-slate-700 dark:text-slate-300">
                                                <strong className="text-indigo-800 dark:text-indigo-300 block mb-1">Explication :</strong>
                                                {activeQuestions[currentIndex].explication}
                                            </div>
                                        )}

                                        <div className="mt-6 flex items-center justify-between">
                                            <button
                                                onClick={() => setPage("home")}
                                                className="text-sm font-medium text-slate-500 hover:text-slate-800 dark:hover:text-slate-200"
                                            >
                                                Quitter le quiz
                                            </button>
                                            {selectedOption !== null && (
                                                <button
                                                    onClick={nextQuestion}
                                                    className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm transition"
                                                >
                                                    {currentIndex + 1 < activeQuestions.length ? "Question suivante →" : "Voir le résultat"}
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center shadow-sm">
                                        <h2 className="text-2xl font-extrabold text-slate-900 dark:text-white">
                                            Quiz terminé !
                                        </h2>
                                        <p className="text-4xl font-black text-indigo-600 dark:text-indigo-400 my-4">
                                            {score} / {activeQuestions.length}
                                        </p>
                                        <div className="flex flex-wrap justify-center gap-3 mt-6">
                                            <button
                                                onClick={() => setPage("home")}
                                                className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm"
                                            >
                                                Retour à l'accueil
                                            </button>
                                            <button
                                                onClick={() => setPage("qpuc")}
                                                className="px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold text-sm"
                                            >
                                                Réviser les 120 questions
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
